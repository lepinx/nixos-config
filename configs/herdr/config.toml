# herdr — terminal workspace manager for AI agents. Out-of-store so Noctalia's
# herdr template can rewrite [theme.custom] (store symlinks are read-only).

onboarding = false

[ui]
agent_panel_scope = "all"

[ui.toast]
# No OS notifications; the completion sound still plays (ui.sound is separate).
delivery = "herdr"

[theme.custom]
accent = "#d8b9ff"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#2d2832"
selection_bg = "#38333d"
surface0 = "#2d2832"
surface1 = "#38333d"
surface_dim = "#16121b"
overlay0 = "#978da0"
overlay1 = "#cec2d6"
text = "#e9dfed"
subtext0 = "#cec2d6"
mauve = "#bec1ff"
green = "#d8b9ff"
yellow = "#f0b2ed"
red = "#ffb4ab"
blue = "#ffb781"
teal = "#ffafcf"
peach = "#ffdeab"

[terminal]
default_shell = "/etc/profiles/per-user/lucho/bin/fish"

[keys]
focus_agent = "prefix+ctrl+1..9"
