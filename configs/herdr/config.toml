# herdr — terminal workspace manager for AI agents. Out-of-store so Noctalia's
# herdr template can rewrite [theme.custom] (store symlinks are read-only).

onboarding = false

[ui]
agent_panel_scope = "all"

[ui.toast]
# No OS notifications; the completion sound still plays (ui.sound is separate).
delivery = "herdr"

[theme.custom]
accent = "#f7b1e0"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#2e282b"
selection_bg = "#393336"
surface0 = "#2e282b"
surface1 = "#393336"
surface_dim = "#171215"
overlay0 = "#9c8d94"
overlay1 = "#d3c2ca"
text = "#ebe0e4"
subtext0 = "#d3c2ca"
mauve = "#f7b1e0"
green = "#f7b1e0"
yellow = "#e0bdd1"
red = "#ffb4ab"
blue = "#ffb3b1"
teal = "#e0bdd1"
peach = "#ffdeab"

[terminal]
default_shell = "/etc/profiles/per-user/lucho/bin/fish"

[keys]
focus_agent = "prefix+ctrl+1..9"
