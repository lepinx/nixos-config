# herdr — terminal workspace manager for AI agents. Out-of-store so Noctalia's
# herdr template can rewrite [theme.custom] (store symlinks are read-only).

onboarding = false

[ui]
agent_panel_scope = "all"

[ui.toast]
# No OS notifications; the completion sound still plays (ui.sound is separate).
delivery = "herdr"

[theme.custom]
accent = "#ffafd4"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#30282b"
selection_bg = "#3b3236"
surface0 = "#30282b"
surface1 = "#3b3236"
surface_dim = "#191114"
overlay0 = "#a08b93"
overlay1 = "#d7c1c8"
text = "#eedfe3"
subtext0 = "#d7c1c8"
mauve = "#d4bbff"
green = "#ffafd4"
yellow = "#e0bbdf"
red = "#ffb4ab"
blue = "#f6bb84"
teal = "#c0c4ec"
peach = "#ffdeab"

[terminal]
default_shell = "/etc/profiles/per-user/lucho/bin/fish"

[keys]
focus_agent = "prefix+ctrl+1..9"
