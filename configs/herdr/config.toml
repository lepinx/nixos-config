# herdr — terminal workspace manager for AI agents. Out-of-store so Noctalia's
# herdr template can rewrite [theme.custom] (store symlinks are read-only).

onboarding = false

[ui]
agent_panel_scope = "all"

[ui.toast]
# No OS notifications; the completion sound still plays (ui.sound is separate).
delivery = "herdr"

[theme.custom]
accent = "#ffc799"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#262626"
selection_bg = "#303030"
surface0 = "#262626"
surface1 = "#303030"
surface_dim = "#050505"
overlay0 = "#5e5e5e"
overlay1 = "#a0a0a0"
text = "#ffffff"
subtext0 = "#a0a0a0"
mauve = "#fbadff"
green = "#99ffe4"
yellow = "#ffc799"
red = "#ff8080"
blue = "#80b3ff"
teal = "#99ffe4"
peach = "#ffc080"

[terminal]
default_shell = "/etc/profiles/per-user/lucho/bin/fish"

[keys]
focus_agent = "prefix+ctrl+1..9"
