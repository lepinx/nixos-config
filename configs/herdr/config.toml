# herdr — terminal workspace manager for AI agents. Out-of-store so Noctalia's
# herdr template can rewrite [theme.custom] (store symlinks are read-only).

onboarding = false

[ui]
agent_panel_scope = "all"

[ui.toast]
# No OS notifications; the completion sound still plays (ui.sound is separate).
delivery = "herdr"

[theme.custom]
accent = "#d2bcff"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#2c2831"
selection_bg = "#37333c"
surface0 = "#2c2831"
surface1 = "#37333c"
surface_dim = "#15121a"
overlay0 = "#958e9f"
overlay1 = "#ccc3d6"
text = "#e7e0ec"
subtext0 = "#ccc3d6"
mauve = "#d2bcff"
green = "#d2bcff"
yellow = "#d1bcfc"
red = "#ffb4ab"
blue = "#fface8"
teal = "#d1bcfc"
peach = "#ffdeab"

[terminal]
default_shell = "/etc/profiles/per-user/lucho/bin/fish"

[keys]
focus_agent = "prefix+ctrl+1..9"
