# herdr — terminal workspace manager for AI coding agents.
#
# Linked into ~/.config/herdr/config.toml as an out-of-store symlink so that
# (a) the file is versioned here and (b) Noctalia's herdr community template
# can rewrite the [theme.custom] section on theme changes (a store symlink is
# read-only and its apply.sh hook fails with "read-only filesystem").
#
# [theme.custom] colors are managed by Noctalia (single theme source of truth);
# [theme] name = "one-dark" stays as the base/fallback palette.

onboarding = false

[ui]
agent_panel_scope = "all"

[ui.toast]
# system = hand background-workspace popups to the OS notification daemon
# (Noctalia), which renders them and plays the notification sound. "herdr"
# would keep them as silent in-app toasts.
delivery = "system"

[theme.custom]
accent = "#d2bcff"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#2c2831"
selection_bg = "#37333c"
surface0 = "#2c2831"
surface1 = "#37333c"
surface_dim = "#15121a"
overlay0 = "#958e9f"
overlay1 = "#ccc3d6"
text = "#e7e0ec"
subtext0 = "#ccc3d6"
mauve = "#d2bcff"
green = "#d2bcff"
yellow = "#d1bcfc"
red = "#ffb4ab"
blue = "#fface8"
teal = "#d1bcfc"
peach = "#ffdeab"

[terminal]
default_shell = "/etc/profiles/per-user/lucho/bin/fish"

[keys]
# Focus agent rows 1–9 with Ctrl+B, then Ctrl+<number>.
focus_agent = "prefix+ctrl+1..9"
