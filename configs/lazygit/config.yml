gui:
  theme:
    activeBorderColor:
      - "#ffc799"
      - bold
    inactiveBorderColor:
      - "#99ffe4"
    searchingActiveBorderColor:
      - "#fbadff"
      - bold
    optionsTextColor:
      - "#a0a0a0"
    selectedLineBgColor:
      - "#262626"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#a0a0a0"
    cherryPickedCommitBgColor:
      - "#fbadff"
    markedBaseCommitFgColor:
      - "#fbadff"
    markedBaseCommitBgColor:
      - "#ff8080"
    unstagedChangesColor:
      - "#ff8080"
    defaultFgColor:
      - "#ffffff"
  sidePanelWidth: 0.23
  mainPanelSplitMode: horizontal
  showNumstatInFilesView: true
  wrapLinesInDiffView: false

git:
  # -w={{width}}: wrap to the lazygit panel width, not the outer terminal's.
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --no-gitconfig --syntax-theme noctalia --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}" -w={{width}}

# gui.theme is rewritten by Noctalia's community lazygit template (out-of-store).
