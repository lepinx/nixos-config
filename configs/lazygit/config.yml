gui:
  theme:
    activeBorderColor:
      - "#ffc799"
      - bold
    inactiveBorderColor:
      - "#99ffe4"
    searchingActiveBorderColor:
      - "#fbadff"
      - bold
    optionsTextColor:
      - "#a0a0a0"
    selectedLineBgColor:
      - "#262626"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#a0a0a0"
    cherryPickedCommitBgColor:
      - "#fbadff"
    markedBaseCommitFgColor:
      - "#fbadff"
    markedBaseCommitBgColor:
      - "#ff8080"
    unstagedChangesColor:
      - "#ff8080"
    defaultFgColor:
      - "#ffffff"
  sidePanelWidth: 0.23
  mainPanelSplitMode: horizontal
  showNumstatInFilesView: true
  wrapLinesInDiffView: false

git:
  diffRenderers:
    - type: stdinFilter
      name: delta
      colorArg: always
      # Truecolor bat theme (not the flat gitconfig "ansi" one that killed the
      # first delta attempt); --no-gitconfig keeps terminal-git features out.
      command: delta --dark --paging=never --no-gitconfig --syntax-theme noctalia --line-numbers
    - type: extDiff
      name: difftastic
      command: difft --color always

# gui.theme is rewritten by Noctalia's community lazygit template (out-of-store).
# | cycles the diff renderers: delta truecolor <-> difftastic AST.
