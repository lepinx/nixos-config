gui:
  theme:
    activeBorderColor:
      - "#f7b1e0"
      - bold
    inactiveBorderColor:
      - "#e0bdd1"
    searchingActiveBorderColor:
      - "#ffb3b1"
      - bold
    optionsTextColor:
      - "#d3c2ca"
    selectedLineBgColor:
      - "#2e282b"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#d3c2ca"
    cherryPickedCommitBgColor:
      - "#ffb3b1"
    markedBaseCommitFgColor:
      - "#ffb3b1"
    markedBaseCommitBgColor:
      - "#ffb4ab"
    unstagedChangesColor:
      - "#ffb4ab"
    defaultFgColor:
      - "#ebe0e4"
  sidePanelWidth: 0.23
  mainPanelSplitMode: horizontal
  showNumstatInFilesView: true
  wrapLinesInDiffView: false

# gui.theme is rewritten by Noctalia's community lazygit template (out-of-store).
# Native renderer, not delta: delta's ansi theme reads flat inside lazygit.
