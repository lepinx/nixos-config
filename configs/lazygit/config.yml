gui:
  theme:
    activeBorderColor:
      - "#ffc799"
      - bold
    inactiveBorderColor:
      - "#99ffe4"
    searchingActiveBorderColor:
      - "#fbadff"
      - bold
    optionsTextColor:
      - "#a0a0a0"
    selectedLineBgColor:
      - "#262626"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#a0a0a0"
    cherryPickedCommitBgColor:
      - "#fbadff"
    markedBaseCommitFgColor:
      - "#fbadff"
    markedBaseCommitBgColor:
      - "#ff8080"
    unstagedChangesColor:
      - "#ff8080"
    defaultFgColor:
      - "#ffffff"
  sidePanelWidth: 0.23
  mainPanelSplitMode: horizontal
  showNumstatInFilesView: true
  wrapLinesInDiffView: false

git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --no-gitconfig --syntax-theme noctalia --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - type: extDiff
      name: difftastic
      # Side-by-side only when the focused panel is wide enough; inline elsewhere.
      command: difft --color=always --background={{colorScheme}} --context={{diffContext}} {{if gt .width 160}}--display side-by-side{{else}}--display inline{{end}}

# gui.theme is rewritten by Noctalia's community lazygit template (out-of-store).
# | cycles the diff renderers: delta truecolor <-> difftastic AST.
