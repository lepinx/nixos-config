gui:
  theme:
    activeBorderColor:
      - "#ffc799"
      - bold
    inactiveBorderColor:
      - "#99ffe4"
    searchingActiveBorderColor:
      - "#fbadff"
      - bold
    optionsTextColor:
      - "#a0a0a0"
    selectedLineBgColor:
      - "#262626"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#a0a0a0"
    cherryPickedCommitBgColor:
      - "#fbadff"
    markedBaseCommitFgColor:
      - "#fbadff"
    markedBaseCommitBgColor:
      - "#ff8080"
    unstagedChangesColor:
      - "#ff8080"
    defaultFgColor:
      - "#ffffff"
  sidePanelWidth: 0.23
  mainPanelSplitMode: horizontal
  showNumstatInFilesView: true
  wrapLinesInDiffView: false

# gui.theme is rewritten by Noctalia's community lazygit template (out-of-store).
# Native renderer, not delta: delta's ansi theme reads flat inside lazygit.
