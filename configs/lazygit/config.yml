gui:
  # One Dark Pro, to match nvim's onedark_dark (see configs/nvim/lua/plugins/theme.lua).
  # Frozen on purpose: the noctalia community lazygit template was a one-shot
  # rewrite, and the desktop palette would clash with the editor otherwise.
  theme:
    activeBorderColor:
      - "#61afef"
      - bold
    inactiveBorderColor:
      - "#4b5263"
    searchingActiveBorderColor:
      - "#e5c07b"
      - bold
    optionsTextColor:
      - "#61afef"
    selectedLineBgColor:
      - "#3e4451"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#56b6c2"
    cherryPickedCommitBgColor:
      - "#c678dd"
    markedBaseCommitFgColor:
      - "#c678dd"
    markedBaseCommitBgColor:
      - "#e06c75"
    unstagedChangesColor:
      - "#e06c75"
    defaultFgColor:
      - "#abb2bf"
  sidePanelWidth: 0.23
  mainPanelSplitMode: horizontal
  showNumstatInFilesView: true
  wrapLinesInDiffView: true

git:
  # -w={{width}}: wrap to the lazygit panel width, not the outer terminal's.
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --no-gitconfig --syntax-theme TwoDark --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

# gui.theme is rewritten by Noctalia's community lazygit template (out-of-store).
