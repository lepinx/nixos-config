# yaml-language-server: $schema=https://json.schemastore.org/lazydocker.json
# ANSI palette names only: no Noctalia template exists for lazydocker, so the
# terminal palette supplies the theme.
gui:
  scrollHeight: 2
  border: "rounded"
  theme:
    activeBorderColor:
      - cyan
      - bold
    inactiveBorderColor:
      - white
    selectedLineBgColor:
      - blue
    optionsTextColor:
      - blue
  sidePanelWidth: 0.333
  showBottomLine: true
  wrapMainPanel: true
