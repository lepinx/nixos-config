# Noctalia owns the colors: its alacritty template only fixes the import path
# below on theme changes (writes through the out-of-store symlink); the rest of
# this file is user-owned. The theme file itself is regenerated at
# ~/.config/alacritty/themes/noctalia.toml.
[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml",
]

[font]
size = 9.0

[font.normal]
family = "JetBrainsMono Nerd Font"
