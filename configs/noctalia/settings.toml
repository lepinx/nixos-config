config_version = 15

[accessibility]
ui_scale = 0.8

[shell]
font_family = "JetBrainsMono Nerd Font"
telemetry_enabled = false
polkit_agent = true

[lockscreen]
enabled = true

[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 660
action = "screen_off"

[idle.behavior.lock-and-suspend]
enabled = true
timeout = 1800
action = "lock_and_suspend"

[battery]
warning_threshold = 20

[theme]
mode = "dark"
source = "community"
builtin = "Tokyo-Night"
community_palette = "Vesper"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = true
builtin_ids = [
  "alacritty",
  "btop",
  "cava",
  "ghostty",
  "gtk3",
  "gtk4",
  "helix",
  "qt",
  "starship",
  "umbriel",
]
community_ids = ["bat", "discord", "fastfetch", "fzf", "herdr", "karere", "lazygit", "neovim", "pi-agent", "yazi"]

[wallpaper]
enabled = true
directory = "~/Pictures/wallpapers"

[wallpaper.default]
path = "/home/lucho/Pictures/wallpapers/1_Mvv7jPyz_digital-art-beautiful-mountains.jpg"

[wallpaper.last]
path = "/home/lucho/Pictures/wallpapers/1_Mvv7jPyz_digital-art-beautiful-mountains.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/lucho/Pictures/wallpapers/1_Mvv7jPyz_digital-art-beautiful-mountains.jpg"

[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.0

[weather]
enabled = true
refresh_minutes = 30
unit = "celsius"
effects = true

[location]
auto_locate = true

[keybinds]
validate = ["Return", "KP_Enter", "Space"]
cancel = ["Escape"]
left = ["Left", "Ctrl+H"]
right = ["Right", "Ctrl+L"]
down = ["Down", "Ctrl+J", "Ctrl+N"]
up = ["Up", "Ctrl+K", "Ctrl+P"]
tab_next = ["Tab"]
tab_previous = ["Shift+ISO_Left_Tab"]

[bar.main]
position = "top"
thickness = 36
background_opacity = 0.88
margin_ends = 8
margin_edge = 6
padding = 10
widget_spacing = 8
font_weight = 600
radius = 12
shadow = true
reserve_space = true
capsule = true
capsule_fill = "surface_variant"
capsule_opacity = 0.55
capsule_radius = 8.0
start = ["launcher", "workspaces", "umbriel_companion"]
center = ["clock"]
end = [
  "tray",
  "notifications",
  "network",
  "bluetooth",
  "volume",
  "battery",
  "control-center",
]

[widget.tray]
type = "tray"
drawer = true
drawer_columns = 3
hide_passive = false

[widget.control-center]
glyph = "brand-qq"

[widget.umbriel_companion]
type = "noctalia/umbriel-companion:bar"

[widget.workspaces]
type = "workspaces"
show_labels = false

[widget.clock]
type = "clock"
format = "{:%a %d %b  %H:%M:%S}"
tooltip_format = "{:%A, %d de %B de %Y}"

[widget.network]
type = "network"
show_label = false

[widget.bluetooth]
type = "bluetooth"
show_label = false
hide_when_no_connected_device = true

[widget.volume]
type = "volume"
show_label = false

[widget.notifications]
type = "notifications"
hide_when_no_unread = true

[dock]
enabled = true
position = "bottom"
icon_size = 32
auto_hide = false
smart_auto_hide = true
reserve_space = false
show_running = true
show_dots = true
show_instance_count = true
launcher_position = "start"
pinned = [
  "org.gnome.Nautilus",
  "thunderbird",
  "discord",
  "com.github.th-ch.youtube-music",
  "helium",
  "firefox",
  "com.mitchellh.ghostty",
  "io.ente.auth",
  "bruno",
  "dbeaver",
  "io.github.tobagin.karere",
  "org.telegram.desktop",
]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 565.0
cy = 523.0
output = "eDP-1"
placement_height = 705.0
placement_width = 1129.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugins]
enabled = [
  "noctalia/translator",
  "noctalia/umbriel-companion",
  "noctalia/bitwarden",
]
