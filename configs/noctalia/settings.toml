config_version = 15

[accessibility]
ui_scale = 0.80000000000000004

[backdrop]
blur_intensity = 0.5
enabled = true
tint_intensity = 0.0

[bar.main]
background_opacity = 0.88
capsule = true
capsule_fill = "surface_variant"
capsule_opacity = 0.55000000000000004
capsule_radius = 8.0
center = [ "clock" ]
end = [ "tray", "notifications", "network", "bluetooth", "volume", "battery", "control-center" ]
font_weight = 600
margin_edge = 6
margin_ends = 8
padding = 10
position = "top"
radius = 12
reserve_space = true
shadow = true
start = [ "launcher", "workspaces", "umbriel_companion" ]
thickness = 36
widget_spacing = 8

[battery]
warning_threshold = 20

[dock]
auto_hide = false
enabled = true
icon_size = 32
launcher_position = "start"
pinned = [
    "org.gnome.Nautilus",
    "thunderbird",
    "discord",
    "com.github.th-ch.youtube-music",
    "helium",
    "firefox",
    "com.mitchellh.ghostty",
    "io.ente.auth",
    "bruno",
    "dbeaver",
    "io.github.tobagin.karere",
    "org.telegram.desktop"
]
position = "bottom"
reserve_space = false
show_dots = true
show_instance_count = true
show_running = true
smart_auto_hide = true

[idle]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

[keybinds]
cancel = [ "Escape" ]
down = [ "Down", "Ctrl+J", "Ctrl+N" ]
left = [ "Left", "Ctrl+H" ]
right = [ "Right", "Ctrl+L" ]
tab_next = [ "Tab" ]
tab_previous = [ "Shift+ISO_Left_Tab" ]
up = [ "Up", "Ctrl+K", "Ctrl+P" ]
validate = [ "Return", "KP_Enter", "Space" ]

[location]
auto_locate = true

[lockscreen]
enabled = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 565.0
    cy = 523.0
    output = "eDP-1"
    placement_height = 705.0
    placement_width = 1129.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "noctalia/translator", "noctalia/umbriel-companion", "noctalia/bitwarden" ]

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true
telemetry_enabled = false

[theme]
builtin = "Tokyo-Night"
community_palette = "Vesper"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "ghostty", "gtk3", "gtk4", "helix", "qt", "starship", "umbriel" ]
    community_ids = [ "pi-agent", "neovim", "fastfetch", "bat", "fzf", "herdr", "starship", "yazi" ]
    enable_builtin_templates = true

[wallpaper]
directory = "~/Pictures/wallpapers"
enabled = true

    [wallpaper.default]
    path = "/home/lucho/Pictures/wallpapers/1_Mvv7jPyz_digital-art-beautiful-mountains.jpg"

    [wallpaper.last]
    path = "/home/lucho/Pictures/wallpapers/1_Mvv7jPyz_digital-art-beautiful-mountains.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/lucho/Pictures/wallpapers/1_Mvv7jPyz_digital-art-beautiful-mountains.jpg"

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "celsius"

[widget.bluetooth]
hide_when_no_connected_device = true
show_label = false
type = "bluetooth"

[widget.clock]
format = "{:%a %d %b  %H:%M:%S}"
tooltip_format = "{:%A, %d de %B de %Y}"
type = "clock"

[widget.control-center]
glyph = "brand-qq"

[widget.network]
show_label = false
type = "network"

[widget.notifications]
hide_when_no_unread = true
type = "notifications"

[widget.tray]
drawer = true
drawer_columns = 3
hide_passive = false
type = "tray"

[widget.volume]
show_label = false
type = "volume"

[widget.workspaces]
show_labels = false
type = "workspaces"